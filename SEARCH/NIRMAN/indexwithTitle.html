<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text-to-Strategy and ML Insights</title>
  <style>
    :root {
      --bg: #f7f8f5;
      --surface: #ffffff;
      --text: #1d2a2a;
      --muted: #5b6b6b;
      --line: #d9dfdb;
      --accent: #0f6b5c;
      --head: #eef2ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121a1a;
        --surface: #1a2424;
        --text: #e6eeec;
        --muted: #93a6a3;
        --line: #2c3a3a;
        --accent: #5fd0b8;
        --head: #223030;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 3rem 1.25rem;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }
    main { max-width: 46rem; margin: 0 auto; }
    h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 0.5rem; }
    p.intro { margin: 0 0 1rem; color: var(--muted); }
    section { margin-bottom: 2.5rem; }
    h2 { font-size: 1.15rem; margin: 0 0 0.6rem; word-break: break-word; }
    h2 .count { color: var(--muted); font-weight: normal; font-size: 0.95rem; }
    .table-wrap {
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.6rem 1rem; text-align: left; border-bottom: 1px solid var(--line); }
    thead th { background: var(--head); font-weight: bold; font-size: 0.9rem; }
    tbody tr:last-child td { border-bottom: none; }
    th.num, td.num { width: 3.5rem; color: var(--muted); }
    td.type { color: var(--muted); width: 6rem; }
    td.question { min-width: 16rem; color: var(--muted); font-size: 0.9rem; }
    .q-text {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      overflow: hidden;
      cursor: pointer;
    }
    .q-text.expanded { display: block; }
    .q-text:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    a { color: var(--accent); text-decoration: none; word-break: break-word; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .status { color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 0 0 2rem; }
    .toolbar .status { font-size: 0.9rem; }
    button#refresh-btn {
      font: inherit;
      font-size: 0.95rem;
      padding: 0.4rem 1rem;
      color: var(--accent);
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 6px;
      cursor: pointer;
    }
    button#refresh-btn:hover:not(:disabled) { background: var(--head); }
    button#refresh-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button#refresh-btn:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>Text-to-Strategy and ML Insights</h1>
    <p class="intro">Files in each NIRMAN folder and sub-folder. Select a file name to open it.</p>
    <div class="toolbar">
      <button id="refresh-btn" type="button">Refresh</button>
      <span id="updated" class="status" aria-live="polite"></span>
    </div>
    <div id="folders">
      <p class="status">Loading files…</p>
    </div>
  </main>

  <script>
    const username = "ai-socialimpact";
    const repo = "Text-to-Strategy-and-ML-insights";
    const branch = "main";
    const basePath = "SEARCH/NIRMAN"; // every folder inside here, at any depth, gets its own table

    const container = document.getElementById('folders');
    const refreshBtn = document.getElementById('refresh-btn');
    const updatedEl = document.getElementById('updated');
    let loading = false;

    // One API call returns the whole repo tree, so nested folders cost nothing extra
    async function getRepoTree() {
      const url = `https://api.github.com/repos/${username}/${repo}/git/trees/${branch}?recursive=1`;
      const response = await fetch(url, { cache: 'no-store' });
      if (response.status === 403) {
        throw new Error("GitHub API rate limit reached. Try again in a few minutes.");
      }
      if (!response.ok) {
        throw new Error(`GitHub API returned status ${response.status}`);
      }
      const data = await response.json();
      if (!Array.isArray(data.tree)) {
        throw new Error("Unexpected response from GitHub");
      }
      return data;
    }

    function naturalCompare(a, b) {
      return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
    }

    // Sort folder paths segment by segment so a parent comes right before its children
    function comparePaths(a, b) {
      const pa = a.split('/');
      const pb = b.split('/');
      const len = Math.min(pa.length, pb.length);
      for (let i = 0; i < len; i++) {
        const c = naturalCompare(pa[i], pb[i]);
        if (c !== 0) return c;
      }
      return pa.length - pb.length;
    }

    // Group files by the folder that directly contains them
    function groupByFolder(tree) {
      const prefix = basePath + "/";
      const groups = new Map();
      tree
        .filter(item => item.type === 'blob' && item.path.startsWith(prefix))
        .forEach(item => {
          const slash = item.path.lastIndexOf('/');
          const folder = item.path.slice(0, slash);
          const name = item.path.slice(slash + 1);
          if (!groups.has(folder)) groups.set(folder, []);
          groups.get(folder).push({ name, path: item.path });
        });
      return [...groups.entries()]
        .sort((a, b) => comparePaths(a[0], b[0]))
        .map(([folder, files]) => ({
          folder,
          files: files.sort((a, b) => naturalCompare(a.name, b.name))
        }));
    }

    function makeEl(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function showMessage(text) {
      container.textContent = "";
      container.appendChild(makeEl('p', text, 'status'));
    }

    // Pull the question out of an HTML report: .report-question, or the block after the "Core Strategic Question" label
    function extractQuestion(htmlText) {
      const doc = new DOMParser().parseFromString(htmlText, 'text/html');
      let node = doc.querySelector('.report-question');
      if (!node) {
        const label = [...doc.querySelectorAll('.question-label')]
          .find(el => /core strategic question/i.test(el.textContent));
        node = label ? label.nextElementSibling : null;
      }
      return node ? node.textContent.replace(/\s+/g, ' ').trim() : "";
    }

    // Fills the cell once the file is fetched; the cell stays blank if there is no question
    async function loadQuestion(path, cell) {
      try {
        const response = await fetch(encodeURI(path), { cache: 'no-cache' });
        if (!response.ok) return;
        const text = extractQuestion(await response.text());
        if (!text) return;

        const box = makeEl('div', text, 'q-text');
        box.title = "Click to expand or collapse";
        box.tabIndex = 0;
        box.setAttribute('role', 'button');
        const toggle = () => box.classList.toggle('expanded');
        box.addEventListener('click', toggle);
        box.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggle();
          }
        });
        cell.appendChild(box);
      } catch (error) {
        // leave the cell blank
      }
    }

    function buildSection({ folder, files }) {
      const section = document.createElement('section');
      const heading = makeEl('h2', folder);
      heading.appendChild(makeEl('span', ` (${files.length} ${files.length === 1 ? 'file' : 'files'})`, 'count'));
      section.appendChild(heading);

      const wrap = makeEl('div', undefined, 'table-wrap');
      const table = document.createElement('table');

      const hasHtml = files.some(f => f.name.toLowerCase().endsWith('.html'));

      const headRow = document.createElement('tr');
      headRow.appendChild(makeEl('th', "#", 'num'));
      headRow.appendChild(makeEl('th', "File"));
      headRow.appendChild(makeEl('th', "Type"));
      if (hasHtml) headRow.appendChild(makeEl('th', "Core strategic question"));
      const thead = document.createElement('thead');
      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      files.forEach((file, i) => {
        const row = document.createElement('tr');
        row.appendChild(makeEl('td', String(i + 1), 'num'));

        const nameCell = document.createElement('td');
        const link = document.createElement('a');
        // Relative link so it works on GitHub Pages
        link.href = encodeURI(file.path);
        link.textContent = file.name;
        nameCell.appendChild(link);
        row.appendChild(nameCell);

        const ext = file.name.includes('.') ? file.name.split('.').pop() : "—";
        row.appendChild(makeEl('td', ext, 'type'));

        if (hasHtml) {
          const questionCell = makeEl('td', undefined, 'question');
          row.appendChild(questionCell);
          if (file.name.toLowerCase().endsWith('.html')) {
            loadQuestion(file.path, questionCell);
          }
        }

        tbody.appendChild(row);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      section.appendChild(wrap);
      return section;
    }

    async function loadFolders() {
      if (loading) return;
      loading = true;
      refreshBtn.disabled = true;
      refreshBtn.textContent = "Refreshing…";
      updatedEl.textContent = "";

      try {
        const data = await getRepoTree();
        const groups = groupByFolder(data.tree);

        if (groups.length === 0) {
          showMessage(`No files found under ${basePath}.`);
          return;
        }

        container.textContent = "";
        groups.forEach(group => container.appendChild(buildSection(group)));

        const time = new Date().toLocaleTimeString();
        updatedEl.textContent = data.truncated
          ? `Last updated ${time}. The repository is very large, so some files may be missing.`
          : `Last updated ${time}`;
      } catch (error) {
        if (container.querySelector('section')) {
          // Keep the existing tables on screen if a refresh fails
          updatedEl.textContent = `Could not refresh (${error.message}). Showing the previous list.`;
        } else {
          showMessage(`Error loading directory list: ${error.message}`);
        }
      } finally {
        loading = false;
        refreshBtn.disabled = false;
        refreshBtn.textContent = "Refresh";
      }
    }

    refreshBtn.addEventListener('click', loadFolders);
    loadFolders();
  </script>
</body>
</html>
