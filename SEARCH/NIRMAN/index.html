<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text-to-Strategy and ML Insights</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --text: #1b2430;
      --muted: #5f6b7a;
      --line: #e1e6ec;
      --head: #f1f4f8;
      --hover: #f6f8fb;
      --accent: #1a56a0;
      --on-accent: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f141b;
        --surface: #171e27;
        --text: #e6ebf1;
        --muted: #9aa7b6;
        --line: #263140;
        --head: #1c2530;
        --hover: #1b2430;
        --accent: #6aa8f0;
        --on-accent: #0f141b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 3rem 1.25rem 4rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.55;
    }
    main { max-width: 64rem; margin: 0 auto; }

    header { margin-bottom: 1.75rem; }
    h1 { font-size: 1.75rem; line-height: 1.25; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 0.35rem; }
    p.intro { margin: 0; color: var(--muted); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1rem;
      margin-bottom: 1.25rem;
    }
    .status { color: var(--muted); font-size: 0.9rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .btn {
      font: inherit;
      font-size: 0.875rem;
      padding: 0.4rem 0.9rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover:not(:disabled) { background: var(--hover); border-color: var(--muted); }
    .btn.primary { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
    .btn.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); filter: brightness(1.08); }
    .btn:focus-visible, summary:focus-visible, a:focus-visible, .q-text:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .btn:disabled { opacity: 0.6; cursor: default; }

    details.folder {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 1rem;
      overflow: hidden;
    }
    summary {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1rem;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary:hover { background: var(--hover); }
    details[open] > summary { border-bottom: 1px solid var(--line); }
    .chevron {
      flex: none;
      width: 0.5rem;
      height: 0.5rem;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(-45deg);
      transition: transform 0.15s ease;
    }
    details[open] > summary .chevron { transform: rotate(45deg); }
    .folder-path { flex: 1; min-width: 0; word-break: break-word; }
    .path-parent { color: var(--muted); }
    .folder-path strong { font-weight: 650; }
    .count { flex: none; color: var(--muted); font-size: 0.85rem; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.7rem 1rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
    thead th { background: var(--head); color: var(--muted); font-size: 0.8125rem; font-weight: 600; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--hover); }
    th.num, td.num { width: 3.25rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    td.file, td.type { white-space: nowrap; }
    td.type { color: var(--muted); }
    td.question { width: 100%; min-width: 18rem; font-size: 0.875rem; color: var(--muted); }
    a { color: var(--accent); text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }

    .q-text {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      overflow: hidden;
      cursor: pointer;
    }
    .q-text.expanded { display: block; }

    @media (prefers-reduced-motion: reduce) {
      .chevron { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Text-to-Strategy and ML Insights</h1>
      <p class="intro">HTML reports in each NIRMAN folder. Select a file name to open it.</p>
    </header>

    <div class="toolbar">
      <span id="updated" class="status" aria-live="polite"></span>
      <div class="actions">
        <button id="expand-btn" class="btn" type="button">Expand all</button>
        <button id="collapse-btn" class="btn" type="button">Collapse all</button>
        <button id="refresh-btn" class="btn primary" type="button">Refresh</button>
      </div>
    </div>

    <div id="folders">
      <p class="status">Loading files…</p>
    </div>
  </main>

  <script>
    const username = "ai-socialimpact";
    const repo = "Text-to-Strategy-and-ML-insights";
    const branch = "main";
    const basePath = "SEARCH/NIRMAN"; // every folder inside here, at any depth, gets its own section

    // Only these file types are listed (and scanned). Use [] to list every file type.
    const allowedExtensions = ['html'];

    const rawBase = `https://raw.githubusercontent.com/${username}/${repo}/${branch}/`;
    const PHRASE = /core\s+strategic\s+question/i;

    const container = document.getElementById('folders');
    const refreshBtn = document.getElementById('refresh-btn');
    const expandBtn = document.getElementById('expand-btn');
    const collapseBtn = document.getElementById('collapse-btn');
    const updatedEl = document.getElementById('updated');
    const openState = new Map(); // remembers which folders are open across refreshes
    let loading = false;

    // One API call returns the whole repo tree, so nested folders cost nothing extra
    async function getRepoTree() {
      const url = `https://api.github.com/repos/${username}/${repo}/git/trees/${branch}?recursive=1`;
      const response = await fetch(url, { cache: 'no-store' });
      if (response.status === 403) {
        throw new Error("GitHub API rate limit reached. Try again in a few minutes.");
      }
      if (!response.ok) {
        throw new Error(`GitHub API returned status ${response.status}`);
      }
      const data = await response.json();
      if (!Array.isArray(data.tree)) {
        throw new Error("Unexpected response from GitHub");
      }
      return data;
    }

    function naturalCompare(a, b) {
      return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
    }

    // Sort folder paths segment by segment so a parent comes right before its children
    function comparePaths(a, b) {
      const pa = a.split('/');
      const pb = b.split('/');
      const len = Math.min(pa.length, pb.length);
      for (let i = 0; i < len; i++) {
        const c = naturalCompare(pa[i], pb[i]);
        if (c !== 0) return c;
      }
      return pa.length - pb.length;
    }

    function extOf(name) {
      return name.includes('.') ? name.split('.').pop().toLowerCase() : "";
    }

    // Group files by the folder that directly contains them
    function groupByFolder(tree) {
      const prefix = basePath + "/";
      const groups = new Map();
      tree
        .filter(item => item.type === 'blob' && item.path.startsWith(prefix))
        .forEach(item => {
          const slash = item.path.lastIndexOf('/');
          const folder = item.path.slice(0, slash);
          const name = item.path.slice(slash + 1);
          if (allowedExtensions.length && !allowedExtensions.includes(extOf(name))) return;
          if (!groups.has(folder)) groups.set(folder, []);
          groups.get(folder).push({ name, path: item.path });
        });
      return [...groups.entries()]
        .sort((a, b) => comparePaths(a[0], b[0]))
        .map(([folder, files]) => ({
          folder,
          files: files.sort((a, b) => naturalCompare(a.name, b.name))
        }));
    }

    function makeEl(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function showMessage(text) {
      container.textContent = "";
      container.appendChild(makeEl('p', text, 'status'));
    }

    function cleanText(node) {
      return node ? node.textContent.replace(/\s+/g, ' ').trim() : "";
    }

    // Generous search of a parsed page for its core strategic question
    function findQuestion(doc) {
      if (!doc || !doc.body) return "";

      // 1. The dedicated class, including close variants such as "report-question-text"
      const selectors = ['.report-question', '[class*="report-question"]', '[class*="strategic-question"]', '[id*="report-question"]'];
      for (const selector of selectors) {
        const text = cleanText(doc.querySelector(selector));
        if (text) return text;
      }

      // 2. The "Core Strategic Question" label: the question may sit in the same element or in the next element
      const labels = [...doc.body.querySelectorAll('*')].filter(el =>
        !['SCRIPT', 'STYLE'].includes(el.tagName) &&
        PHRASE.test(el.textContent) &&
        ![...el.children].some(child => PHRASE.test(child.textContent))
      );

      for (const label of labels) {
        // Text after the label inside the same element, e.g. "Core Strategic Question: How do..."
        const inline = cleanText(label).replace(/core\s+strategic\s+question\s*[:\-–—]?\s*/i, '');
        if (inline.length > 15) return inline;

        // Otherwise the next element, climbing up a few levels if the label is nested in a wrapper
        let node = label;
        for (let depth = 0; depth < 4 && node && node !== doc.body; depth++, node = node.parentElement) {
          let sibling = node.nextElementSibling;
          for (let i = 0; i < 3 && sibling; i++, sibling = sibling.nextElementSibling) {
            const text = cleanText(sibling);
            if (text && !PHRASE.test(text)) return text;
          }
        }
      }
      return "";
    }

    // Try the published page first, then raw.githubusercontent.com (works from any origin)
    async function fetchSource(path) {
      const urls = [encodeURI(path), rawBase + encodeURI(path)];
      for (const url of urls) {
        try {
          const response = await fetch(url, { cache: 'no-cache' });
          if (response.ok) return await response.text();
          console.debug(`Question lookup: ${url} returned ${response.status}`);
        } catch (error) {
          console.debug(`Question lookup: could not fetch ${url}`, error);
        }
      }
      return null;
    }

    // Last resort for pages that build the question with JavaScript: load the page in a hidden frame and read it
    let frameQueue = Promise.resolve();
    function renderedQuestion(path) {
      const run = () => new Promise(resolve => {
        const frame = document.createElement('iframe');
        frame.setAttribute('aria-hidden', 'true');
        frame.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden;';
        const finish = value => {
          clearTimeout(timer);
          frame.remove();
          resolve(value);
        };
        const timer = setTimeout(() => finish(""), 8000);
        frame.addEventListener('load', () => {
          setTimeout(() => {
            try {
              finish(findQuestion(frame.contentDocument));
            } catch (error) {
              finish("");
            }
          }, 500);
        });
        frame.src = encodeURI(path);
        document.body.appendChild(frame);
      });
      frameQueue = frameQueue.then(run, run);
      return frameQueue;
    }

    // Fills the cell once the file is read; the cell stays blank if there is no question
    async function loadQuestion(path, cell) {
      let text = "";
      const source = await fetchSource(path);
      if (source) {
        text = findQuestion(new DOMParser().parseFromString(source, 'text/html'));
      }
      if (!text) {
        text = await renderedQuestion(path);
      }
      if (!text) return;

      const box = makeEl('div', text, 'q-text');
      box.title = "Click to expand or collapse";
      box.tabIndex = 0;
      box.setAttribute('role', 'button');
      const toggle = () => box.classList.toggle('expanded');
      box.addEventListener('click', toggle);
      box.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggle();
        }
      });
      cell.appendChild(box);
    }

    function buildSection({ folder, files }) {
      const details = document.createElement('details');
      details.className = 'folder';
      details.open = openState.has(folder) ? openState.get(folder) : true;
      details.addEventListener('toggle', () => openState.set(folder, details.open));

      // Header: muted parent path, bold folder name, file count
      const summary = document.createElement('summary');
      const slash = folder.lastIndexOf('/');
      const chevron = makeEl('span', undefined, 'chevron');
      chevron.setAttribute('aria-hidden', 'true');
      const title = makeEl('span', undefined, 'folder-path');
      title.appendChild(makeEl('span', folder.slice(0, slash + 1), 'path-parent'));
      title.appendChild(makeEl('strong', folder.slice(slash + 1)));
      const count = makeEl('span', `${files.length} ${files.length === 1 ? 'file' : 'files'}`, 'count');
      summary.append(chevron, title, count);
      details.appendChild(summary);

      const hasHtml = files.some(f => extOf(f.name) === 'html');
      const showType = new Set(files.map(f => extOf(f.name))).size > 1;

      const wrap = makeEl('div', undefined, 'table-wrap');
      const table = document.createElement('table');

      const headRow = document.createElement('tr');
      headRow.appendChild(makeEl('th', "#", 'num'));
      headRow.appendChild(makeEl('th', "File"));
      if (showType) headRow.appendChild(makeEl('th', "Type"));
      if (hasHtml) headRow.appendChild(makeEl('th', "Core strategic question"));
      const thead = document.createElement('thead');
      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      files.forEach((file, i) => {
        const row = document.createElement('tr');
        row.appendChild(makeEl('td', String(i + 1), 'num'));

        const nameCell = makeEl('td', undefined, 'file');
        const link = document.createElement('a');
        // Relative link so it works on GitHub Pages
        link.href = encodeURI(file.path);
        link.textContent = file.name;
        nameCell.appendChild(link);
        row.appendChild(nameCell);

        if (showType) row.appendChild(makeEl('td', extOf(file.name) || "—", 'type'));

        if (hasHtml) {
          const questionCell = makeEl('td', undefined, 'question');
          row.appendChild(questionCell);
          if (extOf(file.name) === 'html') {
            loadQuestion(file.path, questionCell);
          }
        }

        tbody.appendChild(row);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      details.appendChild(wrap);
      return details;
    }

    function setAllOpen(open) {
      container.querySelectorAll('details.folder').forEach(d => { d.open = open; });
    }

    async function loadFolders() {
      if (loading) return;
      loading = true;
      refreshBtn.disabled = true;
      refreshBtn.textContent = "Refreshing…";
      updatedEl.textContent = "";

      try {
        const data = await getRepoTree();
        const groups = groupByFolder(data.tree);

        if (groups.length === 0) {
          showMessage(`No HTML files found under ${basePath}.`);
          return;
        }

        container.textContent = "";
        groups.forEach(group => container.appendChild(buildSection(group)));

        const total = groups.reduce((sum, g) => sum + g.files.length, 0);
        const time = new Date().toLocaleTimeString();
        let message = `${total} ${total === 1 ? 'file' : 'files'} in ${groups.length} ${groups.length === 1 ? 'folder' : 'folders'}. Last updated ${time}.`;
        if (data.truncated) message += " The repository is very large, so some files may be missing.";
        updatedEl.textContent = message;
      } catch (error) {
        if (container.querySelector('details.folder')) {
          // Keep the existing sections on screen if a refresh fails
          updatedEl.textContent = `Could not refresh (${error.message}). Showing the previous list.`;
        } else {
          showMessage(`Error loading directory list: ${error.message}`);
        }
      } finally {
        loading = false;
        refreshBtn.disabled = false;
        refreshBtn.textContent = "Refresh";
      }
    }

    expandBtn.addEventListener('click', () => setAllOpen(true));
    collapseBtn.addEventListener('click', () => setAllOpen(false));
    refreshBtn.addEventListener('click', loadFolders);
    loadFolders();
  </script>
</body>
</html>
