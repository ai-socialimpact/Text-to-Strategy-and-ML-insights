<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text-to-Strategy  and ML Insights</title>
  <style>
    :root {
      --bg: #f7f8f5;
      --surface: #ffffff;
      --text: #1d2a2a;
      --muted: #5b6b6b;
      --line: #d9dfdb;
      --accent: #0f6b5c;
      --head: #eef2ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121a1a;
        --surface: #1a2424;
        --text: #e6eeec;
        --muted: #93a6a3;
        --line: #2c3a3a;
        --accent: #5fd0b8;
        --head: #223030;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 3rem 1.25rem;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }
    main { max-width: 46rem; margin: 0 auto; }
    h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 0.5rem; }
    p.intro { margin: 0 0 2rem; color: var(--muted); }
    section { margin-bottom: 2.5rem; }
    h2 { font-size: 1.15rem; margin: 0 0 0.6rem; }
    h2 .count { color: var(--muted); font-weight: normal; font-size: 0.95rem; }
    .table-wrap {
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.6rem 1rem; text-align: left; border-bottom: 1px solid var(--line); }
    thead th { background: var(--head); font-weight: bold; font-size: 0.9rem; }
    tbody tr:last-child td { border-bottom: none; }
    th.num, td.num { width: 3.5rem; color: var(--muted); }
    td.type { color: var(--muted); width: 6rem; }
    a { color: var(--accent); text-decoration: none; word-break: break-word; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .status { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Text-to-Strategy and ML Insights</h1>
    <p class="intro">Files in each NIRMAN sub-folder. Select a file name to open it.</p>
    <div id="folders">
      <p class="status">Loading files…</p>
    </div>
  </main>

  <script>
    const username = "ai-socialimpact";
    const repo = "Text-to-Strategy-and-ML-insights";
    const basePath = "SEARCH/NIRMAN"; // each sub-folder in here gets its own table
    const apiBase = `https://api.github.com/repos/${username}/${repo}/contents/`;
    const container = document.getElementById('folders');

    async function getContents(path) {
      const response = await fetch(apiBase + encodeURI(path));
      if (response.status === 403) {
        throw new Error("GitHub API rate limit reached. Try again in a few minutes.");
      }
      if (!response.ok) {
        throw new Error(`GitHub API returned status ${response.status}`);
      }
      const data = await response.json();
      if (!Array.isArray(data)) {
        throw new Error("Unexpected response from GitHub");
      }
      return data;
    }

    // Natural sort so 5.html comes before 11.html, Simple_2 before Simple_10
    function byName(a, b) {
      return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
    }

    function makeEl(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function showMessage(text) {
      container.textContent = "";
      container.appendChild(makeEl('p', text, 'status'));
    }

    function buildSection(result) {
      const section = document.createElement('section');
      const heading = makeEl('h2', result.folder.path);

      if (result.error) {
        section.appendChild(heading);
        section.appendChild(makeEl('p', `Error loading this folder: ${result.error}`, 'status'));
        return section;
      }

      const files = result.files.filter(f => f.type === 'file').sort(byName);
      heading.appendChild(makeEl('span', ` (${files.length} ${files.length === 1 ? 'file' : 'files'})`, 'count'));
      section.appendChild(heading);

      if (files.length === 0) {
        section.appendChild(makeEl('p', "No files found in this folder.", 'status'));
        return section;
      }

      const wrap = makeEl('div', undefined, 'table-wrap');
      const table = document.createElement('table');

      const headRow = document.createElement('tr');
      headRow.appendChild(makeEl('th', "#", 'num'));
      headRow.appendChild(makeEl('th', "File"));
      headRow.appendChild(makeEl('th', "Type"));
      const thead = document.createElement('thead');
      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      files.forEach((file, i) => {
        const row = document.createElement('tr');
        row.appendChild(makeEl('td', String(i + 1), 'num'));

        const nameCell = document.createElement('td');
        const link = document.createElement('a');
        // Relative link so it works on GitHub Pages
        link.href = encodeURI(file.path);
        link.textContent = file.name;
        nameCell.appendChild(link);
        row.appendChild(nameCell);

        const ext = file.name.includes('.') ? file.name.split('.').pop() : "";
        row.appendChild(makeEl('td', ext, 'type'));

        tbody.appendChild(row);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      section.appendChild(wrap);
      return section;
    }

    async function loadFolders() {
      try {
        const items = await getContents(basePath);
        const folders = items.filter(item => item.type === 'dir').sort(byName);

        if (folders.length === 0) {
          showMessage("No sub-folders found.");
          return;
        }

        const results = await Promise.all(
          folders.map(async folder => {
            try {
              return { folder, files: await getContents(folder.path) };
            } catch (error) {
              return { folder, error: error.message };
            }
          })
        );

        container.textContent = "";
        results.forEach(result => container.appendChild(buildSection(result)));
      } catch (error) {
        showMessage(`Error loading directory list: ${error.message}`);
      }
    }

    loadFolders();
  </script>
</body>
</html>
